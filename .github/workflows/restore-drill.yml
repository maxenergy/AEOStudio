name: Run the fixed private staging restore drill

on:
  workflow_dispatch:
    inputs:
      build-run-id:
        description: Successful main-branch build run containing the attested recovery image
        required: true
        type: string

permissions:
  actions: read
  attestations: read
  contents: read

concurrency:
  group: staging-private-restore-drill
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1

jobs:
  restore-drill:
    name: Run fixed private staging restore task
    if: github.ref == 'refs/heads/main' && github.event.repository.fork == false
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    environment: restore-drill-staging
    permissions:
      actions: read
      attestations: read
      contents: read
      id-token: write
    steps:
      - name: Initialize the execution evidence envelope
        env:
          EVIDENCE_BUCKET: ${{ vars.AEO_STAGING_RESTORE_EVIDENCE_BUCKET }}
        run: |
          mkdir -p output
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sourceSha "$GITHUB_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg evidencePrefix "s3://${EVIDENCE_BUCKET}/restore-drills/" \
            '{schemaVersion:"aeostudio.restore-drill-execution.v1",environment:"staging",status:"NOT_STARTED",repository:$repository,sourceSha:$sourceSha,runId:$runId,runAttempt:$runAttempt,evidencePrefix:$evidencePrefix}' \
            > output/restore-drill-execution.json

      - name: Verify and download the exact same-source recovery build
        id: build
        env:
          BUILD_RUN_ID: ${{ inputs.build-run-id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > output/build-run.json
          test "$(jq -r .conclusion output/build-run.json)" = "success"
          test "$(jq -r .head_branch output/build-run.json)" = "main"
          test "$(jq -r .head_sha output/build-run.json)" = "$GITHUB_SHA"
          test "$(jq -r .path output/build-run.json)" = ".github/workflows/build-attest.yml"
          test "$(jq -r .name output/build-run.json)" = "Build, attest and deploy staging"
          test "$(jq -r .head_repository.full_name output/build-run.json)" = "$GITHUB_REPOSITORY"
          build_attempt="$(jq -r .run_attempt output/build-run.json)"
          [[ "$build_attempt" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/attempts/$build_attempt/jobs?per_page=100" > output/build-jobs.json
          jq -e --argjson attempt "$build_attempt" \
            '[.jobs[] | select(.name == "Build images once, scan and attest" and .conclusion == "success" and .run_attempt == $attempt)] | length == 1' \
            output/build-jobs.json > /dev/null
          echo "build_attempt=$build_attempt" >> "$GITHUB_OUTPUT"

      - name: Download the exact attested recovery image evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-digests-${{ inputs.build-run-id }}-${{ steps.build.outputs.build_attempt }}
          path: release
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build-run-id }}
          github-token: ${{ github.token }}

      - name: Validate recovery image identity and signed attestations
        id: recovery
        env:
          BUILD_RUN_ATTEMPT: ${{ steps.build.outputs.build_attempt }}
          BUILD_RUN_ID: ${{ inputs.build-run-id }}
          EXPECTED_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          recovery=release/recovery-image.json
          test "$(jq -r .schemaVersion "$recovery")" = "aeostudio.recovery-image.v1"
          test "$(jq -r .repository "$recovery")" = "$GITHUB_REPOSITORY"
          test "$(jq -r .sourceSha "$recovery")" = "$GITHUB_SHA"
          test "$(jq -r .sourceRef "$recovery")" = "refs/heads/main"
          test "$(jq -r .buildRunId "$recovery")" = "$BUILD_RUN_ID"
          test "$(jq -r .buildRunAttempt "$recovery")" = "$BUILD_RUN_ATTEMPT"
          image="$(jq -r .image "$recovery")"
          digest="$(jq -r .digest "$recovery")"
          test "$image" = "${EXPECTED_ACCOUNT_ID}.dkr.ecr.ap-southeast-1.amazonaws.com/aeostudio-recovery"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          subject="oci://${image}@${digest}"
          gh attestation verify "$subject" \
            --bundle release/attestations/recovery-provenance.json \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build-attest.yml" \
            --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main \
            --predicate-type https://slsa.dev/provenance/v1 \
            --deny-self-hosted-runners
          gh attestation verify "$subject" \
            --bundle release/attestations/recovery-sbom.json \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build-attest.yml" \
            --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main \
            --predicate-type https://cyclonedx.org/bom \
            --deny-self-hosted-runners
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Validate the protected staging trust boundary
        env:
          EXPECTED_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          ROLE_ARN: ${{ vars.AWS_STAGING_RESTORE_DRILL_OPERATOR_ROLE_ARN }}
          STATE_MACHINE_ARN: ${{ vars.AWS_STAGING_RESTORE_DRILL_STATE_MACHINE_ARN }}
          EVIDENCE_BUCKET: ${{ vars.AEO_STAGING_RESTORE_EVIDENCE_BUCKET }}
        run: |
          [[ "$EXPECTED_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          test "$ROLE_ARN" = "arn:aws:iam::${EXPECTED_ACCOUNT_ID}:role/aeostudio-staging-restore-drill-operator"
          test "$STATE_MACHINE_ARN" = "arn:aws:states:${AWS_REGION}:${EXPECTED_ACCOUNT_ID}:stateMachine:aeostudio-staging-restore-drill"
          test "$EVIDENCE_BUCKET" = "aeostudio-staging-${EXPECTED_ACCOUNT_ID}-audit"

      - name: Acquire the staging-only restore operator session
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          role-to-assume: ${{ vars.AWS_STAGING_RESTORE_DRILL_OPERATOR_ROLE_ARN }}
          role-session-name: aeostudio-restore-${{ github.run_id }}
          aws-region: ap-southeast-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-duration-seconds: 18000

      - name: Snapshot immutable restore evidence versions
        env:
          EVIDENCE_BUCKET: ${{ vars.AEO_STAGING_RESTORE_EVIDENCE_BUCKET }}
        run: |
          set -euo pipefail
          aws s3api list-object-versions \
            --bucket "$EVIDENCE_BUCKET" \
            --prefix "restore-drills/" \
            --output json \
            > output/restore-drill-evidence-before.json

      - name: Start the fixed restore broker with the bounded identity contract
        id: start
        env:
          BUILD_RUN_ATTEMPT: ${{ steps.build.outputs.build_attempt }}
          BUILD_RUN_ID: ${{ inputs.build-run-id }}
          RECOVERY_IMAGE_DIGEST: ${{ steps.recovery.outputs.digest }}
          STATE_MACHINE_ARN: ${{ vars.AWS_STAGING_RESTORE_DRILL_STATE_MACHINE_ARN }}
        run: |
          execution_name="restore-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          request="$(jq -cn \
            --arg schemaVersion "aeostudio.restore-drill-request.v1" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sourceSha "$GITHUB_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg buildRunId "$BUILD_RUN_ID" \
            --arg buildRunAttempt "$BUILD_RUN_ATTEMPT" \
            --arg recoveryImageDigest "$RECOVERY_IMAGE_DIGEST" \
            '{schemaVersion:$schemaVersion,environment:"staging",repository:$repository,sourceSha:$sourceSha,runId:$runId,runAttempt:$runAttempt,buildRunId:$buildRunId,buildRunAttempt:$buildRunAttempt,recoveryImageDigest:$recoveryImageDigest}')"
          execution_arn="$(aws stepfunctions start-execution \
            --state-machine-arn "$STATE_MACHINE_ARN" \
            --name "$execution_name" \
            --input "$request" \
            --query executionArn \
            --output text)"
          test "$execution_arn" = "${STATE_MACHINE_ARN/stateMachine:/execution:}:$execution_name"
          echo "execution_arn=$execution_arn" >> "$GITHUB_OUTPUT"
          jq \
            --arg executionArn "$execution_arn" \
            --arg startedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '.status = "RUNNING" | .executionArn = $executionArn | .startedAt = $startedAt' \
            output/restore-drill-execution.json \
            > output/restore-drill-execution.tmp
          mv output/restore-drill-execution.tmp output/restore-drill-execution.json

      - name: Wait for the broker-owned task
        id: wait
        env:
          EXECUTION_ARN: ${{ steps.start.outputs.execution_arn }}
          RECOVERY_DIGEST: ${{ steps.recovery.outputs.digest }}
          RECOVERY_IMAGE: ${{ steps.recovery.outputs.image }}
        run: |
          set -euo pipefail
          status=RUNNING
          for _ in $(seq 1 1000); do
            aws stepfunctions describe-execution \
              --execution-arn "$EXECUTION_ARN" \
              --output json \
              > output/restore-broker-result.json
            status="$(jq -er .status output/restore-broker-result.json)"
            case "$status" in
              SUCCEEDED|FAILED|TIMED_OUT|ABORTED)
                break
                ;;
            esac
            sleep 15
          done
          if test "$status" = "RUNNING"; then
            status=TIMED_OUT_BY_RUNNER
          fi
          jq \
            --arg status "$status" \
            --arg completedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '.status = $status | .completedAt = $completedAt' \
            output/restore-drill-execution.json \
            > output/restore-drill-execution.tmp
          mv output/restore-drill-execution.tmp output/restore-drill-execution.json
          if test "$status" = "SUCCEEDED"; then
            jq -er '.output | fromjson' output/restore-broker-result.json \
              > output/restore-task-result.json
            task_arn="$(jq -er '.TaskArn // .taskArn' output/restore-task-result.json)"
            task_definition_arn="$(jq -er '.TaskDefinitionArn // .taskDefinitionArn' output/restore-task-result.json)"
            task_image="$(jq -er '.Containers[0].Image // .containers[0].image' output/restore-task-result.json)"
            task_image_digest="$(jq -er '.Containers[0].ImageDigest // .containers[0].imageDigest' output/restore-task-result.json)"
            [[ "$task_arn" =~ ^arn:aws:ecs:ap-southeast-1:[0-9]{12}:task/aeostudio-staging/[0-9a-f]{32}$ ]]
            [[ "$task_definition_arn" =~ ^arn:aws:ecs:ap-southeast-1:[0-9]{12}:task-definition/aeostudio-staging-restore-drill:[1-9][0-9]*$ ]]
            test "$task_image" = "${RECOVERY_IMAGE}@${RECOVERY_DIGEST}"
            test "$task_image_digest" = "$RECOVERY_DIGEST"
            task_outputs=(
              "task_arn=$task_arn"
              "task_definition_arn=$task_definition_arn"
              "succeeded=true"
            )
          else
            task_outputs=("succeeded=false")
          fi
          printf '%s\n' "${task_outputs[@]}" >> "$GITHUB_OUTPUT"

      - name: Select and validate the unique immutable restore evidence
        id: evidence
        if: ${{ steps.wait.outputs.succeeded == 'true' }}
        env:
          BUILD_RUN_ATTEMPT: ${{ steps.build.outputs.build_attempt }}
          BUILD_RUN_ID: ${{ inputs.build-run-id }}
          EVIDENCE_BUCKET: ${{ vars.AEO_STAGING_RESTORE_EVIDENCE_BUCKET }}
          EXECUTION_ARN: ${{ steps.start.outputs.execution_arn }}
          RECOVERY_DIGEST: ${{ steps.recovery.outputs.digest }}
          RECOVERY_IMAGE: ${{ steps.recovery.outputs.image }}
          TASK_ARN: ${{ steps.wait.outputs.task_arn }}
          TASK_DEFINITION_ARN: ${{ steps.wait.outputs.task_definition_arn }}
        run: |
          set -euo pipefail
          aws s3api list-object-versions \
            --bucket "$EVIDENCE_BUCKET" \
            --prefix "restore-drills/" \
            --output json \
            > output/restore-drill-evidence-after.json

          jq -n \
            --slurpfile before output/restore-drill-evidence-before.json \
            --slurpfile after output/restore-drill-evidence-after.json \
            '
              def evidence_versions($snapshot):
                [
                  $snapshot[0].Versions[]?
                  | select((.Key | type) == "string" and (.VersionId | type) == "string")
                  | select(.Key | startswith("restore-drills/"))
                  | {Key, VersionId}
                ];
              (
                evidence_versions($after)
                - evidence_versions($before)
                | unique_by([.Key, .VersionId])
              ) as $new
              | if ($new | length) == 1
                then $new[0]
                else error("RESTORE_EVIDENCE_VERSION_SET_INVALID")
                end
            ' \
            > output/restore-drill-evidence-selection.json

          evidence_key="$(jq -er '.Key' output/restore-drill-evidence-selection.json)"
          evidence_version_id="$(
            jq -er '.VersionId | select(length > 0 and . != "null")' \
              output/restore-drill-evidence-selection.json
          )"
          task_id="$(
            jq -er \
              '.Key | capture("^restore-drills/(?<task>[0-9a-f]{32})\\.json$").task' \
              output/restore-drill-evidence-selection.json
          )"

          aws s3api get-object \
            --bucket "$EVIDENCE_BUCKET" \
            --key "$evidence_key" \
            --version-id "$evidence_version_id" \
            --checksum-mode ENABLED \
            output/restore-drill.json \
            > output/restore-drill-object-metadata.json

          jq -e \
            --arg taskId "$task_id" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sourceSha "$GITHUB_SHA" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            --arg workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg buildRunId "$BUILD_RUN_ID" \
            --arg buildRunAttempt "$BUILD_RUN_ATTEMPT" \
            --arg executionArn "$EXECUTION_ARN" \
            --arg taskArn "$TASK_ARN" \
            --arg taskDefinitionArn "$TASK_DEFINITION_ARN" \
            --arg recoveryImage "${RECOVERY_IMAGE}@${RECOVERY_DIGEST}" \
            --arg recoveryDigest "$RECOVERY_DIGEST" \
            '
              .schemaVersion == "aeostudio-restore-drill.v1"
              and .environment == "staging"
              and .outcome == "PASSED"
              and .drillId == $taskId
              and .source.repository == $repository
              and .source.sourceSha == $sourceSha
              and .source.workflowRunId == $workflowRunId
              and .source.workflowRunAttempt == $workflowRunAttempt
              and .source.buildRunId == $buildRunId
              and .source.buildRunAttempt == $buildRunAttempt
              and .executionIdentity.executionArn == $executionArn
              and .executionIdentity.taskArn == $taskArn
              and .executionIdentity.taskDefinitionArn == $taskDefinitionArn
              and .recoveryImage.image == $recoveryImage
              and .recoveryImage.digest == $recoveryDigest
              and (.rpoMinutes | type) == "object"
              and (.rpoMinutes | length) > 0
              and (
                [
                  .rpoMinutes
                  | to_entries[]
                  | ((.value | type) == "number" and .value >= 0 and .value <= 15)
                ]
                | all
              )
              and (.rtoHours | type) == "number"
              and .rtoHours >= 0 and .rtoHours <= 4
            ' \
            output/restore-drill.json \
            > /dev/null

          evidence_sha256="$(sha256sum output/restore-drill.json | cut -d ' ' -f 1)"
          printf '%s  restore-drill.json\n' "$evidence_sha256" \
            > output/restore-drill.json.sha256

          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sourceSha "$GITHUB_SHA" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            --arg workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg buildRunId "$BUILD_RUN_ID" \
            --arg buildRunAttempt "$BUILD_RUN_ATTEMPT" \
            --arg evidenceBucket "$EVIDENCE_BUCKET" \
            --arg evidenceKey "$evidence_key" \
            --arg evidenceVersionId "$evidence_version_id" \
            --arg taskId "$task_id" \
            --arg taskArn "$TASK_ARN" \
            --arg taskDefinitionArn "$TASK_DEFINITION_ARN" \
            --arg executionArn "$EXECUTION_ARN" \
            --arg recoveryImage "$RECOVERY_IMAGE" \
            --arg recoveryImageDigest "$RECOVERY_DIGEST" \
            --arg evidenceSha256 "$evidence_sha256" \
            '{
              schemaVersion:"aeostudio.restore-drill-artifact.v1",
              environment:"staging",
              repository:$repository,
              sourceSha:$sourceSha,
              workflowRunId:$workflowRunId,
              workflowRunAttempt:$workflowRunAttempt,
              buildRunId:$buildRunId,
              buildRunAttempt:$buildRunAttempt,
              executionArn:$executionArn,
              taskArn:$taskArn,
              taskDefinitionArn:$taskDefinitionArn,
              recoveryImage:$recoveryImage,
              recoveryImageDigest:$recoveryImageDigest,
              evidenceBucket:$evidenceBucket,
              evidenceKey:$evidenceKey,
              evidenceVersionId:$evidenceVersionId,
              taskId:$taskId,
              evidenceSha256:$evidenceSha256
            }' \
            > output/restore-drill-evidence-manifest.json

          jq \
            --slurpfile manifest output/restore-drill-evidence-manifest.json \
            '.evidence = $manifest[0]' \
            output/restore-drill-execution.json \
            > output/restore-drill-execution.tmp
          mv output/restore-drill-execution.tmp output/restore-drill-execution.json
          echo "validated=true" >> "$GITHUB_OUTPUT"

      - name: Upload the validated restore evidence bound to this workflow run
        if: ${{ steps.evidence.outputs.validated == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: restore-drill-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/restore-drill.json
            output/restore-drill.json.sha256
            output/restore-drill-evidence-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload the non-secret execution envelope
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: restore-drill-execution-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/restore-drill-execution.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce successful restore evidence production
        if: ${{ always() }}
        env:
          RESTORE_SUCCEEDED: ${{ steps.wait.outputs.succeeded }}
          EVIDENCE_VALIDATED: ${{ steps.evidence.outputs.validated }}
        run: |
          test "$RESTORE_SUCCEEDED" = "true"
          test "$EVIDENCE_VALIDATED" = "true"
