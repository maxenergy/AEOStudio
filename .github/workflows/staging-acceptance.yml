name: Prove immutable staging acceptance

on:
  workflow_dispatch:
    inputs:
      build-run-id:
        description: Successful main-branch Build, attest and deploy staging run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: staging-acceptance
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1

jobs:
  staging-acceptance:
    name: Run immutable staging acceptance evidence
    if: github.ref == 'refs/heads/main' && github.event.repository.fork == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: staging-acceptance
    steps:
      - name: Verify the exact successful staging build run
        id: source-run
        env:
          BUILD_RUN_ID: ${{ inputs.build-run-id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > build-run.json
          test "$(jq -r .conclusion build-run.json)" = "success"
          test "$(jq -r .head_branch build-run.json)" = "main"
          test "$(jq -r .path build-run.json)" = ".github/workflows/build-attest.yml"
          test "$(jq -r .head_repository.full_name build-run.json)" = "$GITHUB_REPOSITORY"
          source_sha="$(jq -r .head_sha build-run.json)"
          run_attempt="$(jq -r .run_attempt build-run.json)"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$run_attempt" =~ ^[1-9][0-9]*$ ]]
          test "$source_sha" = "$GITHUB_SHA"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$run_attempt" >> "$GITHUB_OUTPUT"

      - name: Check out the exact accepted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.source-run.outputs.source_sha }}
          persist-credentials: false

      - name: Download the exact attested release manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-digests-${{ inputs.build-run-id }}-${{ steps.source-run.outputs.run_attempt }}
          path: release
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build-run-id }}
          github-token: ${{ github.token }}

      - name: Download the exact staging release contract
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: staging-release-contract-${{ inputs.build-run-id }}-${{ steps.source-run.outputs.run_attempt }}
          path: staging
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build-run-id }}
          github-token: ${{ github.token }}

      - name: Validate the exact deployed staging release
        env:
          ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          BUILD_RUN_ATTEMPT: ${{ steps.source-run.outputs.run_attempt }}
          BUILD_RUN_ID: ${{ inputs.build-run-id }}
          SOURCE_SHA: ${{ steps.source-run.outputs.source_sha }}
        run: |
          set -euo pipefail
          manifest=release/release-digests.json
          contract=staging/staging-release-contract.json
          smoke=staging/staging-smoke-envelope.json
          test "$(jq -r .schemaVersion "$manifest")" = "aeostudio.release.v1"
          test "$(jq -r .repository "$manifest")" = "$GITHUB_REPOSITORY"
          test "$(jq -r .sourceRef "$manifest")" = "refs/heads/main"
          test "$(jq -r .sourceSha "$manifest")" = "$SOURCE_SHA"
          test "$(jq -r .buildRunId "$manifest")" = "$BUILD_RUN_ID"
          test "$(jq -r .buildRunAttempt "$manifest")" = "$BUILD_RUN_ATTEMPT"
          for service in adot api web worker; do
            test "$(jq -r ".images.${service}.image" "$manifest")" = "${ACCOUNT_ID}.dkr.ecr.ap-southeast-1.amazonaws.com/aeostudio-${service}"
            [[ "$(jq -r ".images.${service}.digest" "$manifest")" =~ ^sha256:[0-9a-f]{64}$ ]]
          done
          release_id="staging-${BUILD_RUN_ID}-${BUILD_RUN_ATTEMPT}"
          jq -e \
            --slurpfile manifest "$manifest" \
            --arg releaseId "$release_id" \
            --arg contractName "/aeostudio/staging/releases/${release_id}" \
            --arg brokerArn "arn:aws:states:ap-southeast-1:${ACCOUNT_ID}:stateMachine:aeostudio-staging-release" \
            '
              .executionStatus == "SUCCEEDED" and
              .contract.SchemaVersion == "aeostudio.release-contract.v2" and
              .contract.Environment == "staging" and
              .contract.ReleaseId == $releaseId and
              .contract.ContractName == $contractName and
              .contract.BrokerArn == $brokerArn and
              .contract.Source.Sha == $manifest[0].sourceSha and
              (.contract.Source.BuildRunId | tostring) == $manifest[0].buildRunId and
              (.contract.Source.BuildRunAttempt | tostring) == $manifest[0].buildRunAttempt and
              .contract.Digests.Adot == $manifest[0].images.adot.digest and
              .contract.Digests.Api == $manifest[0].images.api.digest and
              .contract.Digests.Web == $manifest[0].images.web.digest and
              .contract.Digests.Worker == $manifest[0].images.worker.digest and
              .contract.Images.Adot == ($manifest[0].images.adot.image + "@" + $manifest[0].images.adot.digest) and
              .contract.Images.Api == ($manifest[0].images.api.image + "@" + $manifest[0].images.api.digest) and
              .contract.Images.Web == ($manifest[0].images.web.image + "@" + $manifest[0].images.web.digest) and
              .contract.Images.Worker == ($manifest[0].images.worker.image + "@" + $manifest[0].images.worker.digest) and
              .contract.Images.TenantDataBroker == .contract.Images.Worker and
              (.contract.TaskDefinitions.TenantDataBroker | test("/aeostudio-staging-tenant-data-broker:[1-9][0-9]*$")) and
              (.contract.Rollback.TenantDataBroker | test("/aeostudio-staging-tenant-data-broker:[1-9][0-9]*$"))
            ' \
            "$contract" > /dev/null
          jq -e --slurpfile manifest "$manifest" --slurpfile contract "$contract" --arg accountId "$ACCOUNT_ID" '
            .schemaVersion == "aeostudio.staging-smoke-envelope.v1" and
            .sourceSha == $manifest[0].sourceSha and
            .buildRunId == $manifest[0].buildRunId and
            .buildRunAttempt == $manifest[0].buildRunAttempt and
            .digests.adot == $manifest[0].images.adot.digest and
            .digests.api == $manifest[0].images.api.digest and
            .digests.web == $manifest[0].images.web.digest and
            .digests.worker == $manifest[0].images.worker.digest and
            .digests.tenantDataBroker == $manifest[0].images.worker.digest and
            .brokerRuntime.schemaVersion == "aeostudio.tenant-data-broker-runtime.v1" and
            .brokerRuntime.environment == "staging" and
            .brokerRuntime.region == "ap-southeast-1" and
            .brokerRuntime.accountId == $accountId and
            .brokerRuntime.releaseId == $contract[0].contract.ReleaseId and
            .brokerRuntime.taskDefinitionArn == $contract[0].contract.TaskDefinitions.TenantDataBroker and
            .brokerRuntime.workerImage == ($manifest[0].images.worker.image + "@" + $manifest[0].images.worker.digest) and
            .brokerRuntime.adotImage == ($manifest[0].images.adot.image + "@" + $manifest[0].images.adot.digest) and
            .brokerRuntime.desiredCount >= 2 and
            .brokerRuntime.runningCount == .brokerRuntime.desiredCount and
            .brokerRuntime.pendingCount == 0 and
            .brokerRuntime.healthyTargetCount == .brokerRuntime.desiredCount and
            .smoke.schemaVersion == "aeostudio-staging-smoke.v1" and
            .smoke.environment == "staging" and
            .smoke.region == "ap-southeast-1" and
            (.smoke.endpoint.origin | test("^https://[^/?#]+$")) and
            .smoke.imageDigest == $manifest[0].images.api.digest and
            .smoke.traceProbe.operation == "runtimeBuildIdentity" and
            (.smoke.traceProbe.requestId | test("^[0-9a-f-]{36}$")) and
            .smoke.runtimeBuildIdentity.schemaVersion == "aeostudio.runtime-build-identity.v1" and
            .smoke.runtimeBuildIdentity.source == "ecs-container-metadata-v4" and
            .smoke.runtimeBuildIdentity.service == "api" and
            .smoke.runtimeBuildIdentity.image == ($manifest[0].images.api.image + "@" + $manifest[0].images.api.digest) and
            .smoke.runtimeBuildIdentity.imageDigest == $manifest[0].images.api.digest and
            .smoke.runtimeBuildIdentity.imageId == $manifest[0].images.api.digest and
            (.smoke.runtimeBuildIdentity.taskArn | test("^arn:aws:ecs:ap-southeast-1:" + $accountId + ":task/aeostudio-staging/[0-9a-f]{32}$")) and
            .smoke.runtimeBuildIdentity.taskDefinitionArn == $contract[0].contract.TaskDefinitions.Api and
            .smoke.webRuntimeBuildIdentity.schemaVersion == "aeostudio.runtime-build-identity.v1" and
            .smoke.webRuntimeBuildIdentity.source == "ecs-container-metadata-v4" and
            .smoke.webRuntimeBuildIdentity.service == "web" and
            .smoke.webRuntimeBuildIdentity.image == ($manifest[0].images.web.image + "@" + $manifest[0].images.web.digest) and
            .smoke.webRuntimeBuildIdentity.imageDigest == $manifest[0].images.web.digest and
            .smoke.webRuntimeBuildIdentity.imageId == $manifest[0].images.web.digest and
            (.smoke.webRuntimeBuildIdentity.taskArn | test("^arn:aws:ecs:ap-southeast-1:" + $accountId + ":task/aeostudio-staging/[0-9a-f]{32}$")) and
            .smoke.webRuntimeBuildIdentity.taskDefinitionArn == $contract[0].contract.TaskDefinitions.Web and
            .smoke.checks.health.status == 200 and
            .smoke.checks.readiness.status == 200 and
            .smoke.checks.syntheticLogin.status == 200 and
            .smoke.checks.runtimeBuildIdentity.status == 200 and
            .smoke.checks.webRuntimeBuildIdentity.status == 200 and
            .smoke.checks.sealedExperiment.status == 200
          ' "$smoke" > /dev/null

      - name: Validate the staging acceptance role
        env:
          EXPECTED_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          ROLE_ARN: ${{ vars.AWS_STAGING_ACCEPTANCE_ROLE_ARN }}
        run: |
          [[ "$EXPECTED_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          test "$ROLE_ARN" = "arn:aws:iam::${EXPECTED_ACCOUNT_ID}:role/aeostudio-staging-acceptance-operator"

      - name: Acquire the staging acceptance session with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          role-to-assume: ${{ vars.AWS_STAGING_ACCEPTANCE_ROLE_ARN }}
          role-session-name: aeostudio-acceptance-${{ github.run_id }}
          aws-region: ap-southeast-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-duration-seconds: 3600

      - name: Run the fixed digest staging load profile
        id: load
        env:
          AWS_ACCESS_KEY_ID: ''
          AWS_SECRET_ACCESS_KEY: ''
          AWS_SESSION_TOKEN: ''
          AWS_SECURITY_TOKEN: ''
          AWS_EC2_METADATA_DISABLED: 'true'
          AEO_LOAD_BASE_URL: ${{ vars.AEO_STAGING_BASE_URL }}
          AEO_LOAD_APPROVED_ORIGIN: ${{ vars.AEO_STAGING_BASE_URL }}
          AEO_LOAD_APPROVED_HOST: ${{ vars.AEO_STAGING_APPROVED_HOST }}
          AEO_LOAD_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AEO_LOAD_BUILD_RUN_ID: ${{ inputs.build-run-id }}
          AEO_LOAD_BUILD_RUN_ATTEMPT: ${{ steps.source-run.outputs.run_attempt }}
          AEO_LOAD_TENANTS_JSON: ${{ secrets.AEO_STAGING_LOAD_TENANTS_JSON }}
          AEO_LOAD_RAW_SUMMARY_PATH: output/staging-acceptance/.task-18-load-k6.tmp.json
        run: |
          set -euo pipefail
          install -d -m 0700 output/staging-acceptance
          load_started_at="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          load_run_id="$(node --input-type=module --eval "import { randomUUID } from 'node:crypto'; const id = randomUUID(); process.stdout.write(id.slice(0, -4) + '0050');")"
          export AEO_LOAD_RUN_ID="$load_run_id"
          echo "started_at=$load_started_at" >> "$GITHUB_OUTPUT"
          echo "load_run_id=$load_run_id" >> "$GITHUB_OUTPUT"
          AEO_LOAD_API_IMAGE_DIGEST="$(jq -er .images.api.digest release/release-digests.json)"
          AEO_LOAD_ADOT_IMAGE_DIGEST="$(jq -er .images.adot.digest release/release-digests.json)"
          AEO_LOAD_WEB_IMAGE_DIGEST="$(jq -er .images.web.digest release/release-digests.json)"
          AEO_LOAD_WORKER_IMAGE_DIGEST="$(jq -er .images.worker.digest release/release-digests.json)"
          AEO_LOAD_TENANT_DATA_BROKER_IMAGE_DIGEST="$AEO_LOAD_WORKER_IMAGE_DIGEST"
          export AEO_LOAD_ADOT_IMAGE_DIGEST AEO_LOAD_API_IMAGE_DIGEST AEO_LOAD_TENANT_DATA_BROKER_IMAGE_DIGEST AEO_LOAD_WEB_IMAGE_DIGEST AEO_LOAD_WORKER_IMAGE_DIGEST
          docker run --rm --pull=always \
            --platform linux/amd64 \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --volume "$PWD:/workspace:ro" \
            --volume "$PWD/output/staging-acceptance:/workspace/output/staging-acceptance:rw" \
            --workdir /workspace \
            --env AEO_LOAD_BASE_URL \
            --env AEO_LOAD_APPROVED_ORIGIN \
            --env AEO_LOAD_APPROVED_HOST \
            --env AEO_LOAD_AWS_ACCOUNT_ID \
            --env AEO_LOAD_API_IMAGE_DIGEST \
            --env AEO_LOAD_ADOT_IMAGE_DIGEST \
            --env AEO_LOAD_TENANT_DATA_BROKER_IMAGE_DIGEST \
            --env AEO_LOAD_WEB_IMAGE_DIGEST \
            --env AEO_LOAD_WORKER_IMAGE_DIGEST \
            --env AEO_LOAD_BUILD_RUN_ID \
            --env AEO_LOAD_BUILD_RUN_ATTEMPT \
            --env AEO_LOAD_RUN_ID \
            --env AEO_LOAD_TENANTS_JSON \
            --env AEO_LOAD_RAW_SUMMARY_PATH \
            grafana/k6@sha256:65c920dc067d5e2e00befbf982af6ad6ad0117034e8b1c65817c7975c52d4669 \
            run tests/load/task-18-capacity.js
          node scripts/acceptance/commit-write-once-file.mjs \
            "$AEO_LOAD_RAW_SUMMARY_PATH" \
            output/staging-acceptance/task-18-load-raw-summary.json

      - name: Finalize the write-once load evidence
        env:
          AWS_ACCESS_KEY_ID: ''
          AWS_SECRET_ACCESS_KEY: ''
          AWS_SESSION_TOKEN: ''
          AWS_SECURITY_TOKEN: ''
          AWS_EC2_METADATA_DISABLED: 'true'
          AEO_LOAD_BASE_URL: ${{ vars.AEO_STAGING_BASE_URL }}
          AEO_LOAD_APPROVED_ORIGIN: ${{ vars.AEO_STAGING_BASE_URL }}
          AEO_LOAD_APPROVED_HOST: ${{ vars.AEO_STAGING_APPROVED_HOST }}
          AEO_LOAD_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AEO_LOAD_BUILD_RUN_ID: ${{ inputs.build-run-id }}
          AEO_LOAD_BUILD_RUN_ATTEMPT: ${{ steps.source-run.outputs.run_attempt }}
          AEO_LOAD_RUN_ID: ${{ steps.load.outputs.load_run_id }}
          AEO_LOAD_RAW_SUMMARY_PATH: output/staging-acceptance/task-18-load-raw-summary.json
          AEO_LOAD_EVIDENCE_PATH: output/staging-acceptance/task-18-load-evidence.json
        run: |
          set -euo pipefail
          AEO_LOAD_API_IMAGE_DIGEST="$(jq -er .images.api.digest release/release-digests.json)"
          AEO_LOAD_ADOT_IMAGE_DIGEST="$(jq -er .images.adot.digest release/release-digests.json)"
          AEO_LOAD_WEB_IMAGE_DIGEST="$(jq -er .images.web.digest release/release-digests.json)"
          AEO_LOAD_WORKER_IMAGE_DIGEST="$(jq -er .images.worker.digest release/release-digests.json)"
          AEO_LOAD_TENANT_DATA_BROKER_IMAGE_DIGEST="$AEO_LOAD_WORKER_IMAGE_DIGEST"
          export AEO_LOAD_ADOT_IMAGE_DIGEST AEO_LOAD_API_IMAGE_DIGEST AEO_LOAD_TENANT_DATA_BROKER_IMAGE_DIGEST AEO_LOAD_WEB_IMAGE_DIGEST AEO_LOAD_WORKER_IMAGE_DIGEST
          node scripts/load/finalize-task-18-load-evidence.mjs
          test "$(stat -c %a "$AEO_LOAD_RAW_SUMMARY_PATH")" = "600"
          test "$(stat -c %a "$AEO_LOAD_EVIDENCE_PATH")" = "600"

      - name: Require complete frozen causal synthetic fault evidence
        env:
          AEO_ENVIRONMENT: staging
          AEO_EXPECTED_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AEO_SYNTHETIC_FAULT_APPROVED: ${{ vars.AEO_SYNTHETIC_FAULT_APPROVED }}
          AEO_SYNTHETIC_DRILL_ID: acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          AEO_SYNTHETIC_ALARM_EVIDENCE_PATH: output/staging-acceptance/synthetic-alarm-drill.json
        run: |
          set -euo pipefail
          node scripts/observability/run-synthetic-alarm-drill.mjs
          test "$(jq -r .schemaVersion "$AEO_SYNTHETIC_ALARM_EVIDENCE_PATH")" = "aeostudio.synthetic-fault-evidence.v2"
          test "$(jq -r .outcome "$AEO_SYNTHETIC_ALARM_EVIDENCE_PATH")" = "PASSED"

      - name: Prove smoke and load request/job trace correlation
        env:
          AEO_ACCEPTANCE_API_LOG_GROUP: /ecs/aeostudio-staging/api
          AEO_ACCEPTANCE_WORKER_LOG_GROUP: /ecs/aeostudio-staging/worker
          AEO_ACCEPTANCE_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AEO_ACCEPTANCE_BUILD_RUN_ID: ${{ inputs.build-run-id }}
          AEO_ACCEPTANCE_BUILD_RUN_ATTEMPT: ${{ steps.source-run.outputs.run_attempt }}
          AEO_ACCEPTANCE_SOURCE_SHA: ${{ steps.source-run.outputs.source_sha }}
          AEO_ACCEPTANCE_RELEASE_CONTRACT_PATH: staging/staging-release-contract.json
          AEO_ACCEPTANCE_SMOKE_ENVELOPE_PATH: staging/staging-smoke-envelope.json
          AEO_ACCEPTANCE_LOAD_EVIDENCE_PATH: output/staging-acceptance/task-18-load-evidence.json
          AEO_ACCEPTANCE_LOAD_STARTED_AT: ${{ steps.load.outputs.started_at }}
          AEO_ACCEPTANCE_TRACE_EVIDENCE_PATH: output/staging-acceptance/staging-trace-evidence.json
        run: node scripts/acceptance/collect-staging-trace-evidence.mjs

      - name: Finalize the immutable staging acceptance envelope
        env:
          AWS_ACCESS_KEY_ID: ''
          AWS_SECRET_ACCESS_KEY: ''
          AWS_SESSION_TOKEN: ''
          AWS_SECURITY_TOKEN: ''
          AWS_EC2_METADATA_DISABLED: 'true'
          AEO_ACCEPTANCE_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AEO_ACCEPTANCE_BUILD_RUN_ID: ${{ inputs.build-run-id }}
          AEO_ACCEPTANCE_BUILD_RUN_ATTEMPT: ${{ steps.source-run.outputs.run_attempt }}
          AEO_ACCEPTANCE_SOURCE_SHA: ${{ steps.source-run.outputs.source_sha }}
          AEO_ACCEPTANCE_RELEASE_CONTRACT_PATH: staging/staging-release-contract.json
          AEO_ACCEPTANCE_RELEASE_MANIFEST_PATH: release/release-digests.json
          AEO_ACCEPTANCE_SMOKE_ENVELOPE_PATH: staging/staging-smoke-envelope.json
          AEO_ACCEPTANCE_LOAD_RAW_EVIDENCE_PATH: output/staging-acceptance/task-18-load-raw-summary.json
          AEO_ACCEPTANCE_LOAD_EVIDENCE_PATH: output/staging-acceptance/task-18-load-evidence.json
          AEO_ACCEPTANCE_ALARM_EVIDENCE_PATH: output/staging-acceptance/synthetic-alarm-drill.json
          AEO_ACCEPTANCE_TRACE_EVIDENCE_PATH: output/staging-acceptance/staging-trace-evidence.json
          AEO_ACCEPTANCE_ENVELOPE_PATH: output/staging-acceptance/staging-acceptance-envelope.json
        run: |
          set -euo pipefail
          node scripts/acceptance/finalize-staging-acceptance-evidence.mjs
          for evidence in \
            output/staging-acceptance/task-18-load-raw-summary.json \
            output/staging-acceptance/task-18-load-evidence.json \
            output/staging-acceptance/synthetic-alarm-drill.json \
            output/staging-acceptance/staging-trace-evidence.json \
            output/staging-acceptance/staging-acceptance-envelope.json; do
            chmod 0600 "$evidence"
            test "$(stat -c %a "$evidence")" = "600"
          done

      - name: Upload the immutable staging acceptance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-acceptance-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/staging-acceptance/task-18-load-raw-summary.json
            output/staging-acceptance/task-18-load-evidence.json
            output/staging-acceptance/synthetic-alarm-drill.json
            output/staging-acceptance/staging-trace-evidence.json
            output/staging-acceptance/staging-acceptance-envelope.json
          if-no-files-found: error
          retention-days: 90
