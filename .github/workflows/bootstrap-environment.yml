name: Bootstrap an environment with an attested API image

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment whose zero-service database is being initialized
        required: true
        type: choice
        options:
          - staging
          - production
      build-run-id:
        description: Main-branch build run containing the reviewed API digest
        required: true
        type: string
      change-ticket:
        description: Approved one-time bootstrap change ticket
        required: true
        type: string

permissions:
  actions: read
  attestations: read
  contents: read
  id-token: write

concurrency:
  group: bootstrap-${{ inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1

jobs:
  validate-build:
    name: Validate attested bootstrap source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      source-sha: ${{ steps.source-run.outputs.source_sha }}
      run-attempt: ${{ steps.source-run.outputs.run_attempt }}
    steps:
      - name: Require a main-branch dispatch and numeric build run
        env:
          BUILD_RUN_ID: ${{ inputs.build-run-id }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]]

      - name: Verify source workflow gates and exact revision
        id: source-run
        env:
          BUILD_RUN_ID: ${{ inputs.build-run-id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > build-run.json
          test "$(jq -r .conclusion build-run.json)" = "success"
          test "$(jq -r .head_branch build-run.json)" = "main"
          test "$(jq -r .path build-run.json)" = ".github/workflows/build-attest.yml"
          source_sha="$(jq -r .head_sha build-run.json)"
          run_attempt="$(jq -r .run_attempt build-run.json)"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$run_attempt" =~ ^[1-9][0-9]*$ ]]
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$run_attempt" >> "$GITHUB_OUTPUT"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/attempts/$run_attempt/jobs?per_page=100" > build-jobs.json
          for gate in \
            "Blocking application and browser verification" \
            "Blocking policy, dependency, secret and source scans" \
            "Build images once, scan and attest"; do
            jq -e --arg gate "$gate" --argjson attempt "$run_attempt" \
              '[.jobs[] | select(.name == $gate and .conclusion == "success" and .run_attempt == $attempt)] | length == 1' \
              build-jobs.json > /dev/null
          done

      - name: Download the exact attested manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-digests-${{ inputs.build-run-id }}-${{ steps.source-run.outputs.run_attempt }}
          path: release
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build-run-id }}
          github-token: ${{ github.token }}

      - name: Validate the API digest manifest
        env:
          BUILD_RUN_ID: ${{ inputs.build-run-id }}
          BUILD_RUN_ATTEMPT: ${{ steps.source-run.outputs.run_attempt }}
          SOURCE_SHA: ${{ steps.source-run.outputs.source_sha }}
        run: |
          test "$(jq -r .schemaVersion release/release-digests.json)" = "aeostudio.release.v1"
          test "$(jq -r .sourceRef release/release-digests.json)" = "refs/heads/main"
          test "$(jq -r .repository release/release-digests.json)" = "$GITHUB_REPOSITORY"
          test "$(jq -r .sourceSha release/release-digests.json)" = "$SOURCE_SHA"
          test "$(jq -r .buildRunId release/release-digests.json)" = "$BUILD_RUN_ID"
          test "$(jq -r .buildRunAttempt release/release-digests.json)" = "$BUILD_RUN_ATTEMPT"
          api_digest="$(jq -r .images.api.digest release/release-digests.json)"
          api_image="$(jq -r .images.api.image release/release-digests.json)"
          [[ "$api_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$api_image" = "${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-southeast-1.amazonaws.com/aeostudio-api"

      - name: Validate the read-only release verification role
        env:
          EXPECTED_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          ROLE_ARN: ${{ vars.AWS_RELEASE_VERIFY_ROLE_ARN }}
        run: |
          test -n "$EXPECTED_ACCOUNT_ID"
          test "$ROLE_ARN" = "arn:aws:iam::${EXPECTED_ACCOUNT_ID}:role/aeostudio-release-verifier"

      - name: Acquire read-only ECR verification credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_VERIFY_ROLE_ARN }}
          role-session-name: aeostudio-bootstrap-verify-${{ github.run_id }}
          aws-region: ap-southeast-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-duration-seconds: 900

      - name: Log in to private ECR for attestation verification
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64
        with:
          mask-password: true

      - name: Verify API provenance and CycloneDX SBOM before approval
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source-run.outputs.source_sha }}
        run: |
          digest="$(jq -r .images.api.digest release/release-digests.json)"
          image="$(jq -r .images.api.image release/release-digests.json)"
          subject="oci://${image}@${digest}"
          gh attestation verify "$subject" \
            --bundle release/attestations/api-provenance.json \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build-attest.yml" \
            --source-digest "$SOURCE_SHA" \
            --source-ref "refs/heads/main" \
            --predicate-type "https://slsa.dev/provenance/v1" \
            --deny-self-hosted-runners
          gh attestation verify "$subject" \
            --bundle release/attestations/api-sbom.json \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build-attest.yml" \
            --source-digest "$SOURCE_SHA" \
            --source-ref "refs/heads/main" \
            --predicate-type "https://cyclonedx.org/bom" \
            --deny-self-hosted-runners

  bootstrap:
    name: Run fixed private bootstrap broker
    needs: validate-build
    if: ${{ always() && needs.validate-build.result == 'success' }}
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: bootstrap-${{ inputs.environment }}
    steps:
      - name: Check out the exact attested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.validate-build.outputs.source-sha }}
          persist-credentials: false

      - name: Download the exact bootstrap manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-digests-${{ inputs.build-run-id }}-${{ needs.validate-build.outputs.run-attempt }}
          path: release
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build-run-id }}
          github-token: ${{ github.token }}

      - name: Select and validate the protected bootstrap operator
        id: operator
        env:
          ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          BOOTSTRAP_COMPLETE: ${{ vars.AEO_BOOTSTRAP_COMPLETE }}
          CHANGE_TICKET: ${{ inputs.change-ticket }}
          ENVIRONMENT: ${{ inputs.environment }}
          PRODUCTION_ROLE: ${{ vars.AWS_PRODUCTION_BOOTSTRAP_OPERATOR_ROLE_ARN }}
          STAGING_ROLE: ${{ vars.AWS_STAGING_BOOTSTRAP_OPERATOR_ROLE_ARN }}
        run: |
          test "$BOOTSTRAP_COMPLETE" != "true"
          test -n "$CHANGE_TICKET"
          if [ "$ENVIRONMENT" = "staging" ]; then
            role="$STAGING_ROLE"
          else
            role="$PRODUCTION_ROLE"
          fi
          test "$role" = "arn:aws:iam::${ACCOUNT_ID}:role/aeostudio-${ENVIRONMENT}-bootstrap-operator"
          echo "role_arn=$role" >> "$GITHUB_OUTPUT"

      - name: Acquire fixed bootstrap-broker credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          role-to-assume: ${{ steps.operator.outputs.role_arn }}
          role-session-name: aeostudio-bootstrap-${{ inputs.environment }}-${{ github.run_id }}
          aws-region: ap-southeast-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-duration-seconds: 10800

      - name: Run the reviewed fixed bootstrap broker
        id: bootstrap
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          api_digest="$(jq -r .images.api.digest release/release-digests.json)"
          node scripts/bootstrap/run-bootstrap.mjs \
            --environment "$ENVIRONMENT" \
            --region "$AWS_REGION" \
            --expected-account-id "${{ vars.AWS_ACCOUNT_ID }}" \
            --expected-api-digest "$api_digest" \
            --execution-name "bootstrap-${ENVIRONMENT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --confirm "bootstrap:${ENVIRONMENT}" \
            --output-evidence release/bootstrap-evidence.json

      - name: Upload immutable bootstrap evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bootstrap-evidence-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release/release-digests.json
            release/bootstrap-evidence.json
          if-no-files-found: error
          retention-days: 90
